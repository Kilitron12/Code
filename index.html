/* ============ ROMICHE MUSCU MAXIMUS V2 — PIXEL EDITION ============ */
:root{
  --bg:#9BA8AC; --floor:#7E8B8F;
  --steel-l:#A9B2B8; --steel-m:#6B7378;
  --dark:#3A3E42; --ink:#1E2226;
  --skin:#E8A87C; --skin-sh:#C98B5E;
  --wood:#7A5230; --blood:#B5533F;
}
*{margin:0;padding:0;box-sizing:border-box;border-radius:0!important;}
html{background:var(--floor);}
body{
  font-family:'VT323',monospace;font-size:20px;line-height:1.25;
  color:var(--ink);background:var(--bg);
  background-image:
    repeating-linear-gradient(0deg,transparent 0 62px,rgba(30,34,38,.10) 62px 64px),
    repeating-linear-gradient(90deg,transparent 0 62px,rgba(30,34,38,.10) 62px 64px);
  min-height:100vh;padding:10px;
  -webkit-font-smoothing:none;
}
img,.sprite{image-rendering:pixelated;image-rendering:crisp-edges;}

/* ---- cadre 9-slice rétro ---- */
.panel{
  background:var(--steel-l);
  border:4px solid var(--ink);
  box-shadow:
    inset 3px 3px 0 rgba(255,255,255,.35),
    inset -3px -3px 0 var(--steel-m),
    6px 6px 0 rgba(30,34,38,.45);
  padding:12px;
}
.panel-dark{background:var(--dark);color:var(--steel-l);
  box-shadow:inset 3px 3px 0 rgba(0,0,0,.5),inset -3px -3px 0 #2a2e32,6px 6px 0 rgba(30,34,38,.45);}

h1,h2,h3,.pxfont{font-family:'Press Start 2P',monospace;line-height:1.5;}
h1{font-size:clamp(15px,4.2vw,26px);text-shadow:3px 3px 0 var(--ink);color:var(--skin);}
h2{font-size:14px;margin-bottom:8px;}
h3{font-size:11px;margin:8px 0 4px;}

.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:12px;}

/* ---- boutons pixel ---- */
button{
  font-family:'Press Start 2P',monospace;font-size:11px;line-height:1.5;
  color:var(--ink);background:var(--steel-l);
  border:4px solid var(--ink);
  box-shadow:inset 3px 3px 0 rgba(255,255,255,.4),inset -3px -3px 0 var(--steel-m),4px 4px 0 var(--ink);
  padding:10px 12px;cursor:pointer;text-align:left;width:100%;
  transition:none;
}
button:active:not(:disabled){
  transform:translate(4px,4px);
  box-shadow:inset 3px 3px 0 rgba(255,255,255,.4),inset -3px -3px 0 var(--steel-m),0 0 0 var(--ink);
}
button:disabled{
  cursor:not-allowed;color:var(--steel-m);
  background:var(--floor);
  box-shadow:inset 3px 3px 0 rgba(255,255,255,.15),inset -3px -3px 0 rgba(30,34,38,.25),4px 4px 0 var(--ink);
}
button .sub{display:block;font-family:'VT323',monospace;font-size:17px;margin-top:4px;color:var(--dark);}
button:disabled .sub{color:var(--steel-m);}
button .warn{display:block;font-family:'VT323',monospace;font-size:17px;margin-top:4px;color:var(--blood);font-weight:bold;}
button.primary{background:var(--skin);box-shadow:inset 3px 3px 0 rgba(255,255,255,.45),inset -3px -3px 0 var(--skin-sh),4px 4px 0 var(--ink);}
button.danger{background:var(--blood);color:#fff;box-shadow:inset 3px 3px 0 rgba(255,255,255,.3),inset -3px -3px 0 #8a3c2d,4px 4px 0 var(--ink);}
button.danger .sub{color:#f0d9d2;}

/* ---- header ---- */
header.panel{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;}
.daybox{font-family:'Press Start 2P',monospace;font-size:10px;text-align:right;line-height:1.8;}

/* ---- layout principal ---- */
.main{display:grid;grid-template-columns:300px 1fr;gap:12px;align-items:start;}
@media(max-width:760px){.main{grid-template-columns:1fr;}}

/* ---- Romiche-Meter ---- */
.meter .stage{
  background:var(--floor);border:4px solid var(--ink);
  box-shadow:inset 4px 4px 0 rgba(30,34,38,.3);
  display:flex;justify-content:center;align-items:flex-end;
  padding:8px 0 0;margin-bottom:10px;position:relative;overflow:hidden;
  background-image:repeating-linear-gradient(90deg,transparent 0 30px,rgba(30,34,38,.12) 30px 32px);
}
.badges{position:absolute;top:4px;left:6px;font-size:22px;letter-spacing:2px;}
.stat{margin-bottom:8px;}
.stat .lbl{display:flex;justify-content:space-between;font-family:'Press Start 2P',monospace;font-size:9px;margin-bottom:3px;}
.blocks{display:flex;gap:2px;}
.blocks i{flex:1;height:12px;background:var(--floor);border:2px solid var(--ink);box-shadow:inset 1px 1px 0 rgba(0,0,0,.25);}
.blocks i.on{box-shadow:inset 2px 2px 0 rgba(255,255,255,.35);}
.b-mm i.on{background:var(--skin-sh);}
.b-fat i.on{background:var(--wood);}
.b-nrj i.on{background:var(--skin);}
.b-cred i.on{background:var(--steel-m);background:#5d666b;}
.wallet{font-family:'Press Start 2P',monospace;font-size:11px;margin-top:10px;
  background:var(--dark);color:var(--skin);padding:8px;border:4px solid var(--ink);
  display:flex;justify-content:space-between;}

/* idle : micro-respiration */
.sprite-wrap.breathe{animation:breathe 2s steps(2) infinite;}
@keyframes breathe{0%,100%{transform:translateY(0)}50%{transform:translateY(1px)}}
/* boucle de curl 1→2→3→4 */
.sprite.train{animation:curl .8s steps(4) infinite;}
.sprite.train.fast,.sprite.boost{animation:curl .4s steps(4) infinite;}
@keyframes curl{from{background-position-x:0}to{background-position-x:-464px}}
/* booster 🚀 : saturation + glow orange */
.sprite.boost,.sprite.train.fast{filter:saturate(1.5) brightness(1.05) drop-shadow(0 0 6px var(--skin));}
/* pump 💦 : halo pulsant sur le wrapper */
.sprite-wrap.pump{animation:pumpGlow 1.2s steps(3) infinite;}
@keyframes pumpGlow{
  0%,100%{filter:drop-shadow(0 0 2px var(--skin))}
  50%{filter:drop-shadow(0 0 9px var(--skin)) drop-shadow(0 0 14px var(--skin-sh))}
}
/* blessé 🩹 */
.sprite.hurt{filter:grayscale(.8) brightness(.9);transform:rotate(-4deg) translateY(3px);animation:none;}
/* intoxiqué 🤢 */
.sprite.sick{filter:hue-rotate(55deg) saturate(1.15);}
.sprite.sick.hurt{filter:grayscale(.8) hue-rotate(55deg);}
/* victoire */
.sprite.win{animation:curl .3s steps(4) infinite;filter:saturate(1.6) drop-shadow(0 0 10px gold);}

/* ---- lieux / onglets ---- */
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.tabs button{width:auto;flex:1 1 auto;font-size:9px;padding:8px 6px;text-align:center;}
.tabs button.on{background:var(--dark);color:var(--skin);
  box-shadow:inset 3px 3px 0 rgba(0,0,0,.5),4px 4px 0 var(--ink);}
.loc-head{display:flex;gap:10px;align-items:center;margin-bottom:10px;}
.loc-head img{width:84px;height:84px;object-fit:cover;border:4px solid var(--ink);box-shadow:4px 4px 0 rgba(30,34,38,.4);}
.loc-desc{font-size:19px;color:var(--dark);}
.actions{display:grid;gap:8px;}

/* ---- journal ---- */
.journal{max-height:220px;overflow-y:auto;font-size:19px;}
.journal p{padding:3px 6px;border-bottom:2px solid rgba(155,168,172,.15);}
.journal p:first-child{background:rgba(232,168,124,.12);}
.journal .t{color:var(--skin-sh);font-family:'Press Start 2P',monospace;font-size:8px;margin-right:6px;}

/* ---- écrans title / boss / victoire ---- */
.screen-center{max-width:640px;margin:20px auto;text-align:center;display:flex;flex-direction:column;gap:14px;}
.screen-center img.portrait{width:min(420px,86vw);border:6px solid var(--ink);box-shadow:8px 8px 0 rgba(30,34,38,.5);margin:0 auto;}
.tagline{font-size:22px;color:var(--dark);}
.gigachad{font-size:min(120px,28vw);line-height:1;filter:drop-shadow(6px 6px 0 var(--ink));}
.vs{font-family:'Press Start 2P',monospace;font-size:26px;color:var(--blood);text-shadow:3px 3px 0 var(--ink);}
.bossmsg{font-size:21px;background:var(--dark);color:var(--steel-l);padding:10px;border:4px solid var(--ink);text-align:left;min-height:70px;}

/* ---- event modal ---- */
.overlay{position:fixed;inset:0;background:rgba(30,34,38,.75);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50;}
.overlay .panel{max-width:520px;width:100%;}
.overlay .evt-txt{font-size:20px;margin:8px 0 12px;}

/* ---- flash doré victoire ---- */
.goldflash{position:fixed;inset:0;pointer-events:none;z-index:99;
  animation:gold 1.6s steps(6) 3;background:gold;opacity:0;}
@keyframes gold{0%,100%{opacity:0}50%{opacity:.55}}
.victory h1{color:gold;text-shadow:4px 4px 0 var(--ink);animation:vicblink 1s steps(2) infinite;}
@keyframes vicblink{50%{color:var(--skin)}}

/* ---- accessibilité mouvement réduit ---- */
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;}
  .sprite.train,.sprite.boost,.sprite.win{background-position-x:-232px;} /* pic de contraction statique */
}
::-webkit-scrollbar{width:14px;background:var(--floor);}
::-webkit-scrollbar-thumb{background:var(--steel-m);border:3px solid var(--ink);}
</style>

/* =============== ÉTAT CENTRAL =============== */
const PHASES = ["🌅 Matin","☀️ Après-midi","🌆 Soirée","🌙 Nuit"];
const START = () => ({
  screen:"title",          // title | game | boss | victory
  day:1, phase:0,
  mm:5, fat:12, energy:100, cred:10, money:20,
  pump:0,                  // tours de pump restants 💦
  booster:false,           // Rage du Minotaure 🚀 (x2 MM au prochain training)
  injured:0,               // jours de blessure restants 🩹
  intoxPending:false,      // shaker périmé : la vengeance arrive demain
  intoxicated:0,           // phases d'intoxication restantes 🤢
  loc:"salle",
  event:null,              // événement en cours (modal)
  boss:null,               // état du combat Giga-Chad
  bossTries:0,
  anim:"idle",             // idle | train (override temporaire)
  log:[],
});
let S = START();
let trainTimer = null;

/* =============== OUTILS =============== */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=n=>Math.floor(Math.random()*n);
const chance=p=>Math.random()<p;
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
function log(msg){
  S.log.unshift({t:`J${S.day} ${PHASES[S.phase]}`,msg});
  if(S.log.length>60)S.log.pop();
}
function gain(stat,v){ // applique + clamp
  if(stat==="mm")S.mm=clamp(S.mm+v,0,100);
  if(stat==="fat")S.fat=clamp(S.fat+v,5,35);
  if(stat==="energy")S.energy=clamp(S.energy+v,0,100);
  if(stat==="cred")S.cred=clamp(S.cred+v,0,100);
  if(stat==="money")S.money=Math.max(0,S.money+v);
}

/* Chaque action consomme une phase. La nuit, on ne fait que dormir. */
function spendPhase(){
  if(S.pump>0){S.pump--; if(S.pump===0)log("💦 Le pump retombe. Le t-shirt flotte à nouveau.");}
  if(S.intoxicated>0){S.intoxicated--; if(S.intoxicated===0)log("🤢→😌 L'estomac signe l'armistice.");}
  S.phase=Math.min(3,S.phase+1);
}

function playTrainAnim(){
  S.anim="train";
  clearTimeout(trainTimer);
  trainTimer=setTimeout(()=>{S.anim="idle";render();},2500);
}

function trainMultiplier(){
  let m=1, tags=[];
  if(S.booster){m*=2;tags.push("🚀 x2 Rage du Minotaure");S.booster=false;}
  if(S.pump>0){m*=1.2;tags.push("💦 +20% pump");}
  if(S.intoxicated>0){m*=0.5;tags.push("🤢 -50% intoxiqué");}
  return {m,tags};
}

/* =============== NOUVELLE JOURNÉE =============== */
function sleep(){
  const wasInjured=S.injured>0;
  S.day++; S.phase=0; S.anim="idle";
  gain("energy",wasInjured?50:70);
  if(S.injured>0){
    S.injured--;
    log(S.injured>0?`🩹 Encore ${S.injured} jour(s) de repos forcé. Le squat rack te manque, tu lui manques aussi.`
                   :"🩹→💪 Blessure guérie ! Les haltères tremblent déjà.");
  }
  log(`🌅 Jour ${S.day}. Réveil. Les courbatures chantent, Romiche répond présent.`);
  if(S.intoxPending){
    S.intoxPending=false; S.intoxicated=2; gain("energy",-30);
    log("🤢 Le shaker périmé contre-attaque ! -30 Énergie, gains divisés par 2 pendant 2 actions. La date de péremption, c'était pas une suggestion.");
  }
  // Abonnement : prélevé tous les 7 jours (J8, J15, ...)
  if(S.day>1 && S.day%7===1){
    if(S.money>=15){gain("money",-15);log("💸 -15€ : prélèvement du Temple de la Fonte. Le prix de la gloire.");}
    else{S.money=0;gain("cred",-10);log("💸😱 Découvert ! La banque appelle, le Temple ricane. -10 Street Cred.");}
  }
  render();
}

/* =============== BOSS : LE GIGA-CHAD =============== */
function bossChoice(kind){
  const B=S.boss;
  if(B.round===1){
    let me=S.mm+S.cred/2+(S.pump>0?10:0);
    const chad=95+rnd(20);
    if(kind==="safe"){B.lastTxt="Double biceps contrôlé, sourire Colgate. Propre. Solide. Académique.";}
    else{
      if(chance(.5)){me+=30;B.lastTxt="MOST MUSCULAR EN HURLANT. La salle entière s'arrête. Une grand-mère applaudit.";}
      else{me-=20;B.lastTxt="Le Most Muscular part en crampe de mollet. Tu poses comme un flamant rose électrocuté.";}
    }
    if(me>=chad){
      B.round=2;
      B.msg=B.lastTxt+`\n\n🏆 Manche 1 GAGNÉE (${Math.round(me)} vs ${chad}) ! Le Giga-Chad hausse un sourcil : « Pas mal, le posing. Mais la fonte ne ment jamais. DÉVELOPPÉ COUCHÉ. MAX. MAINTENANT. »`;
    }else{
      bossLose(B.lastTxt+`\n\n💀 Manche 1 perdue (${Math.round(me)} vs ${chad}). Le Giga-Chad baille : « Reviens quand t'auras fini ta puberté musculaire. »`);
    }
  }else{
    let me=S.mm*2+S.energy+rnd(30)+(S.pump>0?15:0);
    const chad=225+rnd(25);
    if(kind==="safe"){B.lastTxt="Tu charges lourd mais lucide. La barre plie, tes yeux non.";}
    else{
      if(chance(.5)){me+=50;B.lastTxt="DEUX DISQUES ROUGES EN PLUS. La barre hurle, tu hurles plus fort. REP VALIDÉE.";}
      else{me=0;B.lastTxt="Les disques rouges t'écrasent. Le pareur sauve ta cage thoracique in extremis.";}
    }
    if(me>=chad){
      S.screen="victory";S.boss=null;
      log("👑 LE GIGA-CHAD EST TOMBÉ. La salle scande ton nom : RO-MICHE ! RO-MICHE !");
    }else{
      bossLose(B.lastTxt+`\n\n💀 Manche 2 perdue (${Math.round(me)} kg vs ${chad} kg). Le Giga-Chad remet SES disques : « Reviens quand t'auras mangé, gamin. »`);
    }
  }
  render();
}
function bossLose(msg){
  S.bossTries++;
  S.boss={round:0,msg}; // round 0 = écran de défaite
  gain("energy",-20);gain("cred",-5);
  log("💀 Défaite face au Giga-Chad. -20⚡, -5 Cred. Il est REJOUABLE : mange, dors, reviens.");
}

/* =============== RENDU (fonction unique) =============== */
const app=document.getElementById("app");

function blocks(cls,val,max){
  let h=`<div class="blocks ${cls}">`;
  for(let i=0;i<10;i++)h+=`<i class="${val/max>i/10?"on":""}"></i>`;
  return h+"</div>";
}
function stat(cls,ico,name,val,max,suffix=""){
  return `<div class="stat"><div class="lbl"><span>${ico} ${name}</span><span>${Math.floor(val)}${suffix}</span></div>${blocks(cls,val,max)}</div>`;
}

function spriteHTML(){
  let cls="sprite",wrap="sprite-wrap";
  const win=S.screen==="victory";
  if(win)cls+=" win";
  else if(S.injured>0)cls+=" hurt";
  else if(S.anim==="train")cls+=" train"+(S.booster?" fast":"");
  else if(S.booster)cls+=" boost";
  else wrap+=" breathe";
  if(S.intoxicated>0)cls+=" sick";
  if(S.pump>0&&S.injured===0)wrap+=" pump";
  return `<div class="${wrap}"><div class="${cls}"></div></div>`;
}
function badges(){
  const b=[];
  if(S.booster)b.push("🚀");if(S.pump>0)b.push("💦");
  if(S.injured>0)b.push("🩹");if(S.intoxicated>0)b.push("🤢");
  return b.join(" ");
}

function meterHTML(){
  return `<div class="panel meter">
    <h2>ROMICHE-METER</h2>
    <div class="stage"><span class="badges">${badges()}</span>${spriteHTML()}</div>
    ${stat("b-mm","💪","Masse Musc.",S.mm,100,"/100")}
    ${stat("b-fat","🥓","Masse Grasse",S.fat,35,"%")}
    ${stat("b-nrj","⚡","Énergie",S.energy,100,"/100")}

}

function actionsHTML(){
  const L=LOCATIONS[S.loc];
  const tabs=Object.entries(LOCATIONS).map(([k,v])=>
    `<button class="${k===S.loc?"on":""}" onclick="go('${k}')">${v.name}</button>`).join("");
  const btns=L.actions().map((a,i)=>{
    const reason=a.can();
    const warn=(!reason&&a.warn&&a.warn())||null;
    return `<button class="${a.cls||""}" ${reason?"disabled":""} onclick="act('${S.loc}',${i})">
      ${a.label}
      ${reason?`<span class="warn">⛔ ${reason}</span>`:warn?`<span class="warn">${warn}</span>`:`<span class="sub">${a.sub}</span>`}
    </button>`;}).join("");
  return `<div class="panel">
    <div class="tabs">${tabs}</div>
    <div class="loc-head">
      ${L.portrait?`<img src="${PORTRAIT}" alt="Romiche à la salle">`:""}
      <div><h2>${L.name}</h2><div class="loc-desc">${L.desc}</div></div>
    </div>
    <div class="actions">${btns}</div>
  </div>`;
}

    <header class="panel">
      <div class="pxfont" style="font-size:12px">💪 ROMICHE MUSCU MAXIMUS <span style="color:var(--blood)">V2</span></div>
      <div class="daybox">JOUR ${S.day}<br>${PHASES[S.phase]}</div>
    </header>
    <div class="main">${meterHTML()}<div style="display:flex;flex-direction:column;gap:12px">${actionsHTML()}${journalHTML()}</div></div>
    ${eventHTML()}
  </div>`;
}

/* =============== HANDLERS GLOBAUX =============== */
window.go=k=>{S.loc=k;render();};
window.act=(loc,i)=>{const a=LOCATIONS[loc].actions()[i];if(a.can())return;a.run();render();};
window.evChoice=i=>{S.event.choices[i].run();};
window.bossChoice=bossChoice;
window.endBoss=()=>{S.boss=null;S.screen="game";S.loc="salle";render();};
window.startGame=()=>{
  S.screen="game";
  log("💪 Jour 1. Romiche pousse la porte du Temple de la Fonte. 20€ en poche, 95 points de muscle à conquérir.");
  render();
};
window.restart=()=>{S=START();render();};

render();
</script>
</body>
</html>
